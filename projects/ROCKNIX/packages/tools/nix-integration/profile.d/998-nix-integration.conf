# Defaults for custom-image Nix integration.
#
# Layer 4: standard single-user Nix on real /nix.
#   Bootstrapped at runtime by nixctl install.
#
# Layer 5: persistent Nix profiles for CLI tools.
#   The official single-user installer creates ${HOME}/.nix-profile pointing
#   at the root profile, and Nix 2.34.x profile commands operate on that link
#   on ROCKNIX. Keep ${HOME}/.nix-profile/bin first on PATH so plain
#   `nix profile install nixpkgs#tool` exposes `tool` in fresh shells.
#
# The PATH prefixes below are shipped unconditionally because /etc is read-only
# at runtime; an empty /nix/var/nix/profiles/default/bin or missing
# ~/.nix-profile/bin is harmless -- the shell silently skips PATH entries that
# resolve to nothing and falls through to /storage/bin (storage-local user
# environment wrappers).

# PATH composition. Each block is idempotent (skipped when the entry is
# already present). Ordering after all three blocks run, lowest precedence
# first:
#   ${HOME}/.nix-profile/bin                      (Layer 5: persistent profile)
#   /nix/var/nix/profiles/default/bin             (Layer 4: real nix)
#   /storage/bin                                  (storage-local user env)

case ":${PATH:-}:" in
  *:/storage/bin:*)
    ;;
  *)
    export PATH="/storage/bin:${PATH:-}"
    ;;
esac

case ":${PATH:-}:" in
  *:/nix/var/nix/profiles/default/bin:*)
    ;;
  *)
    export PATH="/nix/var/nix/profiles/default/bin:${PATH:-}"
    ;;
esac

if [ -n "${HOME:-}" ]; then
  case ":${PATH:-}:" in
    *:"${HOME}/.nix-profile/bin":*)
      ;;
    *)
      export PATH="${HOME}/.nix-profile/bin:${PATH:-}"
      ;;
  esac
fi
