# Storage-only defaults for the experimental Nix integration layer.
# This package intentionally does not install a Nix store into the image.
# Run nix-portable-install to create or repair the storage-backed toolbox.

if [ -z "${NIX_PORTABLE_DIR:-}" ]; then
  export NIX_PORTABLE_DIR="/storage/apps/nix-portable"
fi

if [ -z "${NP_LOCATION:-}" ]; then
  export NP_LOCATION="/storage"
fi

if [ -z "${NP_RUNTIME:-}" ]; then
  export NP_RUNTIME="proot"
fi

case ":${PATH:-}:" in
  *:/storage/bin:*)
    ;;
  *)
    export PATH="/storage/bin:${PATH:-}"
    ;;
esac
