name: Build image

on:
  workflow_call:
    inputs:
      PROJECT:
        required: true
        type: string
      DEVICE:
        required: true
        type: string
      OWNER_LC:
        required: true
        type: string
      NIGHTLY:
        description: "build nightly version"
        type: string
        required: true
      OFFICIAL:
        description: "build official version"
        type: string
        required: true
      ARTIFACT_PREFIX:
        description: "Uploaded image/update artifact prefix"
        type: string
        required: false
        default: "ROCKNIX"
      DOCKER_IMAGE:
        description: "Docker image reference to use for the build container"
        type: string
        required: false
        default: ""

jobs:
  build-aarch64-image:
    runs-on: ubuntu-24.04
    env:
      JAVA_HOME: /usr
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      DOCKER_IMAGE: ${{ inputs.DOCKER_IMAGE || format('ghcr.io/{0}/rocknix-build:latest', inputs.OWNER_LC) }}
      ARCH: aarch64
      CACHE_KEY: ccache-aarch64-${{ inputs.DEVICE }}-image-${{ github.sha }}
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
      CHEEVOS_DEV_LOGIN: ${{ secrets.CHEEVOS_DEV_LOGIN }}
      GAMESDB_APIKEY: ${{ secrets.GAMESDB_APIKEY }}
      SCREENSCRAPER_DEV_LOGIN: ${{ secrets.SCREENSCRAPER_DEV_LOGIN }}
      NIGHTLY: ${{ inputs.NIGHTLY }}
      OFFICIAL: ${{ inputs.OFFICIAL }}
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.7.0
        with:
          skip-components: docker-engine
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # SM8550 minimal-host builds skip the host UX/emulator jobs, so the
      # image step consumes the base aarch64 artifacts directly instead of
      # the emu-libretro / emu-standalone aggregate artifacts.
      - name: Download aarch64 (${{ inputs.DEVICE }})
        if: ${{ inputs.DEVICE == 'SM8550' }}
        uses: actions/download-artifact@v8
        with:
          name: aarch64 (${{ inputs.DEVICE }})

      - name: Extract artifact aarch64
        if: ${{ inputs.DEVICE == 'SM8550' }}
        run: tar -xf build.aarch64.tar

      - name: Clean up compressed aarch64 file
        if: ${{ inputs.DEVICE == 'SM8550' }}
        run: rm build.aarch64.tar

      - name: Download aarch64 build (${{ inputs.DEVICE }})
        if: ${{ inputs.DEVICE == 'SM8550' }}
        uses: actions/download-artifact@v8
        with:
          name: aarch64 build (${{ inputs.DEVICE }})

      - name: Extract artifact aarch64 build
        if: ${{ inputs.DEVICE == 'SM8550' }}
        run: tar -xf build.build.aarch64.tar

      - name: Clean up compressed aarch64 build file
        if: ${{ inputs.DEVICE == 'SM8550' }}
        run: rm build.build.aarch64.tar

      - name: Download arm (${{ inputs.DEVICE }})
        if: ${{ inputs.DEVICE != 'SM8650' && inputs.DEVICE != 'SM8550' && inputs.DEVICE != 'SM8750' }}
        uses: actions/download-artifact@v8
        with:
          name: arm (${{ inputs.DEVICE }})

      - name: Extract artifact arm
        if: ${{ inputs.DEVICE != 'SM8650' && inputs.DEVICE != 'SM8550' && inputs.DEVICE != 'SM8750' }}
        run: |
          tar --zstd -xf build.arm.tar.zst

      - name: Clean up compressed arm file
        if: ${{ inputs.DEVICE != 'SM8650' && inputs.DEVICE != 'SM8550' && inputs.DEVICE != 'SM8750' }}
        run: rm build.arm.tar.zst
        
      - name: Download emu-libretro (${{ inputs.DEVICE }})
        if: ${{ inputs.DEVICE != 'SM8550' }}
        uses: actions/download-artifact@v8
        with:
          name: emu-libretro (${{ inputs.DEVICE }})

      - name: Extract artifact emu-libretro
        if: ${{ inputs.DEVICE != 'SM8550' }}
        run: |
          cat build.emu-libretro.tar.part* > build.emu-libretro.tar
          tar -xf build.emu-libretro.tar

      - name: Clean up compressed emu-libretro file
        if: ${{ inputs.DEVICE != 'SM8550' }}
        run: rm build.emu-libretro.tar*

      - name: Download emu-standalone (${{ inputs.DEVICE }})
        if: ${{ inputs.DEVICE != 'SM8550' }}
        uses: actions/download-artifact@v8
        with:
          name: emu-standalone (${{ inputs.DEVICE }})

      - name: Extract artifact emu-standalone
        if: ${{ inputs.DEVICE != 'SM8550' }}
        run: |
          cat build.emu-standalone.tar.part* > build.emu-standalone.tar
          tar --skip-old-files -xf build.emu-standalone.tar

      - name: Clean up compressed emu-standalone file
        if: ${{ inputs.DEVICE != 'SM8550' }}
        run: rm build.emu-standalone.tar*

      # clean to rebuild retroarch with 32bit enabled
      - name: Clean retroarch
        if: ${{ inputs.DEVICE != 'SM8550' }}
        run: |
          ./scripts/get_env > .env
          docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "${DOCKER_IMAGE}" \
            bash -c "./scripts/clean retroarch"
      # clean to rebuild emulationstation with credentials
      - name: Clean emulationstation
        if: ${{ inputs.DEVICE != 'SM8550' }}
        run: |
          ./scripts/get_env > .env
          docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "${DOCKER_IMAGE}" \
            bash -c "./scripts/clean emulationstation"

      - name: build
        run: |
          ./scripts/get_env > .env
          set -e
          { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "${DOCKER_IMAGE}" \
            bash -c "./scripts/build_distro"; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
          exit_code=$(<docker_exit_code)
          exit $exit_code

      - name: Archive output.logs (${{ inputs.DEVICE }}-aarch64-image)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs (${{ inputs.DEVICE }}-aarch64-image)
          path: |
            output.log
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Verify SM8550 host and seed artifacts
        if: ${{ inputs.DEVICE == 'SM8550' }}
        run: |
          set -euo pipefail
          budget_mib="$(sed -n -e 's/.*SM8550_FLASH_PARTITION_BUDGET_MIB:-\([0-9][0-9]*\).*/\1/p' -e 's/^[[:space:]]*SM8550_FLASH_PARTITION_BUDGET_MIB="\{0,1\}\([0-9][0-9]*\).*/\1/p' projects/ROCKNIX/devices/SM8550/options | head -1)"
          if [ -z "${budget_mib}" ]; then
            echo "unable to parse SM8550_FLASH_PARTITION_BUDGET_MIB" >&2
            exit 1
          fi
          budget_bytes="$((budget_mib * 1024 * 1024))"
          update_tars="$(find target -maxdepth 1 -name 'ROCKNIX-*.tar' | sort)"
          update_tar_count="$(printf '%s\n' "${update_tars}" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "${update_tar_count}" -ne 1 ]; then
            echo "expected exactly one SM8550 update tar, found ${update_tar_count}" >&2
            exit 1
          fi
          update_tar="${update_tars}"
          system_bytes="$(tar -tvf "${update_tar}" | awk '$NF ~ /(^|\/)target\/SYSTEM$/ { print $3; exit }')"
          if [ -z "${system_bytes}" ]; then
            echo "${update_tar} does not contain target/SYSTEM" >&2
            exit 1
          fi
          if [ "${system_bytes}" -gt "${budget_bytes}" ]; then
            echo "${update_tar} target/SYSTEM exceeds SM8550 SYSTEM budget: ${system_bytes} > ${budget_bytes}" >&2
            exit 1
          fi
          expected_seed="$(sed -n 's/^PKG_NIX_GUEST_ROOTFS_SEED_ARCHIVE="\{0,1\}\([^" ]*\)"\{0,1\}$/\1/p' projects/ROCKNIX/packages/tools/rocknix-guest-substrate/package.mk | sed -n '1p')"
          expected_seed_sha="$(sed -n 's/^PKG_NIX_GUEST_ROOTFS_SEED_SHA256="\{0,1\}\([^" ]*\)"\{0,1\}$/\1/p' projects/ROCKNIX/packages/tools/rocknix-guest-substrate/package.mk | sed -n '1p')"
          if [ -z "${expected_seed}" ] || [ -z "${expected_seed_sha}" ]; then
            echo "unable to parse expected SM8550 guest seed archive/SHA256" >&2
            exit 1
          fi
          seed_entry="$(tar -tf "${update_tar}" | awk -v want="target/seed/${expected_seed}" '{ suffix="/" want; if ($0 == want || (length($0) >= length(suffix) && substr($0, length($0) - length(suffix) + 1) == suffix)) { print; exit } }')"
          if [ -z "${seed_entry}" ]; then
            echo "${update_tar} missing expected SM8550 guest seed payload: target/seed/${expected_seed}" >&2
            exit 1
          fi
          actual_seed_sha="$(tar -xOf "${update_tar}" "${seed_entry}" | sha256sum | awk '{print $1}')"
          if [ "${actual_seed_sha}" != "${expected_seed_sha}" ]; then
            echo "${update_tar}:${seed_entry} SHA256 mismatch: ${actual_seed_sha} != ${expected_seed_sha}" >&2
            exit 1
          fi
          tar -tf "${update_tar}" | grep -Eq '(^|/)target/SYSTEM$'
          for image in target/ROCKNIX-*.img.gz; do
            gzip -t "${image}"
          done
          for checksum in target/ROCKNIX-*.img.gz.sha256 target/ROCKNIX-*.tar.sha256; do
            [ -f "${checksum}" ] || continue
            (cd target && sha256sum -c "$(basename "${checksum}")")
          done

      - name: Get date
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      # SM8550 artifacts carry the -thin-host suffix because SM8550 now
      # always boots the Nix guest as main-space.
      - name: Compute artifact suffix
        id: artifact-suffix
        run: |
          if [ "${DEVICE}" = "SM8550" ]; then
            echo "suffix=-thin-host" >> $GITHUB_OUTPUT
          else
            echo "suffix=" >> $GITHUB_OUTPUT
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.ARTIFACT_PREFIX }}-image-${{ inputs.DEVICE }}${{ steps.artifact-suffix.outputs.suffix }}-${{ env.DATE }}
          path: |
            target/ROCKNIX-*.img.gz
            target/ROCKNIX-*.img.gz.sha256
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.ARTIFACT_PREFIX }}-update-${{ inputs.DEVICE }}${{ steps.artifact-suffix.outputs.suffix }}-${{ env.DATE }}
          path: |
            target/ROCKNIX-*.tar
            target/ROCKNIX-*.tar.sha256
          compression-level: 0
          if-no-files-found: error
