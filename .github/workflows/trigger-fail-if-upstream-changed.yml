name: Fail on upstream packages changes

# Disabled on the custom branch: this fork intentionally modifies upstream
# packages (e.g. patching systemd to retain systemd-nspawn for the planned
# Layer 9 NixOS-in-nspawn experiment). Leaving the auto pull_request trigger
# in place would block our own PRs. Switched to manual-only so the workflow
# definition is preserved for upstream merges.

on:
  workflow_dispatch:

jobs:
  check-upstream-packages:
    if: github.repository == 'ROCKNIX/distribution'
    runs-on: ubuntu-latest
    steps:
      - name: Fail if upstream packages changed
        run: |
          echo "🚫 ERROR: Modifying files in the upstream 'packages' folder is forbidden!"
          echo "Please do not make changes to this folder."
          exit 1