name: Build device

on:
  workflow_call:
    inputs:
      PROJECT:
        description: "The project name"
        type: string
        required: true
      DEVICE:
        description: "The device name"
        type: string
        required: true
      OWNER_LC:
        description: "repo owner name"
        type: string
        required: true
      NIGHTLY:
        description: "build nightly version"
        type: string
        required: true
      OFFICIAL:
        description: "build official version"
        type: string
        required: true
      ARTIFACT_PREFIX:
        description: "Uploaded image/update artifact prefix"
        type: string
        required: false
        default: "ROCKNIX"
      DOCKER_IMAGE:
        description: "Docker image reference to use for build-container jobs"
        type: string
        required: false
        default: ""

jobs:
  build-arm:
    uses: ./.github/workflows/build-arm.yml
    secrets: inherit
    with:
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      OWNER_LC: ${{ inputs.OWNER_LC }}

  build-aarch64-toolchain:
    uses: ./.github/workflows/build-aarch64-toolchain.yml
    secrets: inherit
    with:
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      OWNER_LC: ${{ inputs.OWNER_LC }}
      DOCKER_IMAGE: ${{ inputs.DOCKER_IMAGE }}

  build-aarch64:
    needs: build-aarch64-toolchain
    uses: ./.github/workflows/build-aarch64.yml
    secrets: inherit
    with:
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      OWNER_LC: ${{ inputs.OWNER_LC }}
      DOCKER_IMAGE: ${{ inputs.DOCKER_IMAGE }}

  build-aarch64-mame-lr:
    needs: build-aarch64-toolchain
    if: ${{ inputs.DEVICE != 'SM8550' }}
    uses: ./.github/workflows/build-aarch64-mame-lr.yml
    secrets: inherit
    with:
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      OWNER_LC: ${{ inputs.OWNER_LC }}

  build-aarch64-qt6:
    needs: build-aarch64
    if: ${{ inputs.DEVICE != 'SM8550' }}
    uses: ./.github/workflows/build-aarch64-qt6.yml
    secrets: inherit
    with:
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      OWNER_LC: ${{ inputs.OWNER_LC }}

  build-aarch64-emu-libretro:
    needs:
      - build-aarch64
      - build-aarch64-mame-lr
      - build-aarch64-qt6
    if: ${{ inputs.DEVICE != 'SM8550' && always() && !cancelled() && !contains(needs.*.result, 'failure')  }}
    uses: ./.github/workflows/build-aarch64-emu-libretro.yml
    secrets: inherit
    with:
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      OWNER_LC: ${{ inputs.OWNER_LC }}

  build-aarch64-emu-standalone:
    needs:
      - build-aarch64
      - build-aarch64-qt6
    if: ${{ inputs.DEVICE != 'SM8550' && always() && !cancelled() && !contains(needs.*.result, 'failure')  }}
    uses: ./.github/workflows/build-aarch64-emu-standalone.yml
    secrets: inherit
    with:
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      OWNER_LC: ${{ inputs.OWNER_LC }}

  build-aarch64-image:
    needs:
      - build-aarch64
      - build-aarch64-emu-libretro
      - build-aarch64-emu-standalone
      - build-arm
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure')  }}
    uses: ./.github/workflows/build-aarch64-image.yml
    secrets: inherit
    with:
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      OWNER_LC: ${{ inputs.OWNER_LC }}
      NIGHTLY: ${{ inputs.NIGHTLY }}
      OFFICIAL: ${{ inputs.OFFICIAL }}
      ARTIFACT_PREFIX: ${{ inputs.ARTIFACT_PREFIX }}
      DOCKER_IMAGE: ${{ inputs.DOCKER_IMAGE }}

  purge-artifact:
    name: Artifacts cleanup
    needs: build-aarch64-image
    # Only purge intermediate artifacts on the main release branches.
    # Feature branches keep them so build-image-only.yml (the fast-iter
    # workflow) can reuse arm / emu-libretro / emu-standalone instead
    # of rebuilding the full ~5h matrix when iterating on the image
    # step alone (e.g. nix-integration post_install changes).
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && (github.ref_name == 'main' || github.ref_name == 'next' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: geekyeggo/delete-artifact@v6
        continue-on-error: true
        with:
          name: |
            aarch64 (${{ inputs.DEVICE }})
            aarch64 build (${{ inputs.DEVICE }})
            aarch64-toolchain (${{ inputs.DEVICE }})
            arm (${{ inputs.DEVICE }})
            emu-libretro (${{ inputs.DEVICE }})
            emu-standalone (${{ inputs.DEVICE }})
            mame-lr (${{ inputs.DEVICE }})
            qt6 (${{ inputs.DEVICE }})
          failOnError: false    
